<div class="cards">

    <div class="card total">
        <h3>Total Tasks</h3>
        <h1>{{total()}}</h1>
    </div>

    <div class="card complete">
        <h3>Completed</h3>
        <h1>{{completed()}}</h1>
    </div>

    <div class="card pending">
        <h3>Pending</h3>
        <h1>{{pending()}}</h1>
    </div>

</div>
